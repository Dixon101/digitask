<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | DigiTask</title>
  <meta name="description" content="Contact the DigiTask team for support, partnerships, or general inquiries." />
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="/js/ux-qa.js"></script>
  <style>.skip-link{position:absolute;left:8px;top:8px;padding:10px 14px;background:#111827;color:#fff;border-radius:8px;z-index:1000;transform:translateY(-150%);transition:transform .2s ease}.skip-link:focus{transform:translateY(0);outline:2px solid #6366f1;outline-offset:2px}</style>
</head>
<body class="bg-gray-50 font-sans">
  <a href="#main" class="skip-link">Skip to main content</a>
  <header class="bg-gradient-to-br from-indigo-600 to-sky-500 text-white py-10 shadow">
    <div class="container mx-auto px-6">
      <nav class="flex items-center justify-between">
        <a href="/" class="text-2xl font-extrabold tracking-tight">DigiTask</a>
        <button onclick="history.back()" class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-md"><i class="fas fa-arrow-left"></i> Back</button>
      </nav>
      <h1 class="text-4xl md:text-5xl font-extrabold mt-6">Contact Us</h1>
      <p class="text-white/90 mt-2 max-w-3xl">We’d love to hear from you. Reach out for support, partnerships, or press.</p>
    </div>
  </header>
  <main id="main" role="main" class="container mx-auto px-6 py-12">
    <section class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
      <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-semibold mb-2">Email</h2>
        <p class="text-gray-600">General: <a href="mailto:admin@thedigitask.com" class="text-indigo-600 hover:underline">admin@thedigitask.com</a></p>
        <p class="text-gray-600">Support: <a href="mailto:support@thedigitask.com" class="text-indigo-600 hover:underline">support@thedigitask.com</a></p>
      </div>
      <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-semibold mb-2">Social</h2>
        <p class="text-gray-600">Follow our updates on LinkedIn and X (Twitter).</p>
      </div>
    </section>
    <div class="text-center">
      <a href="/" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-full shadow"><i class="fas fa-home"></i> Go to Home</a>
    </div>
  </main>
  <footer class="py-10 text-center text-gray-400"><p>&copy; 2025 DigiTask. All rights reserved.</p></footer>
</body>
</html>
