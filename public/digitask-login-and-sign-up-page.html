    // --- Geolocation Functions ---
    /**
     * Get user's location based on their IP address
     * Uses a free IP geolocation service
     */
    async function getUserLocation() {
      try {
        // Using ipapi.co for IP-based geolocation (free tier)
        const response = await fetch('https://ipapi.co/json/');
        const locationData = await response.json();
        
        return {
          country: locationData.country_name || 'Unknown',
          region: locationData.region || 'Unknown',
          city: locationData.city || 'Unknown',
          latitude: locationData.latitude || null,
          longitude: locationData.longitude || null,
          ip: locationData.ip || 'Unknown',
          timezone: locationData.timezone || 'Unknown',
          timestamp: new Date()
        };
      } catch (error) {
        console.warn('Failed to get user location:', error);
        // Return default location data if geolocation fails
        return {
          country: 'Unknown',
          region: 'Unknown',
          city: 'Unknown',
          latitude: null,
          longitude: null,
          ip: 'Unknown',
          timezone: 'Unknown',
          timestamp: new Date()
        };
      }
    }

    // --- Utility Functions (same as before) ---
    function displayMessage(message, type = "info") {
        const messageBox = document.createElement('div');
        messageBox.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-50 flex items-center space-x-2 animate-fade-in`;
        if (type === "error") {
          messageBox.classList.add('bg-red-600');
          messageBox.innerHTML = `<i class="fas fa-times-circle"></i> <span>${message}</span>`;
        } else if (type === "success") {
          messageBox.classList.add('bg-green-600');
          messageBox.innerHTML = `<i class="fas fa-check-circle"></i> <span>${message}</span>`;
        } else {
          messageBox.classList.add('bg-blue-600');
          messageBox.innerHTML = `<i class="fas fa-info-circle"></i> <span>${message}</span>`;
        }
        document.body.appendChild(messageBox);
        setTimeout(() => {
          messageBox.remove();
        }, 3000); // Remove after 3 seconds
    }

    function showInputError(inputElement, errorElement, message) {
        inputElement.classList.add('input-error');
        errorElement.textContent = message;
        errorElement.classList.remove('hidden');
    }

    function clearInputError(inputElement, errorElement) {
        inputElement.classList.remove('input-error');
        errorElement.textContent = '';
        errorElement.classList.add('hidden');
    }

    function setupPasswordToggle(buttonId, inputId) {
      const toggleBtn = document.getElementById(buttonId);
      const passwordInput = document.getElementById(inputId);
      
      toggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleBtn.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
      });
    }

    // --- Tab Switching Logic (same as before) ---
    function switchTab(tabToActivate) {
      // Clear all errors and input styling before switching
      [loginEmailError, loginPasswordError, loginGlobalError,
       signupFullNameError, signupUsernameError, signupEmailError, signupPasswordError, signupConfirmPasswordError, termsError, signupGlobalError,
       resetEmailError, resetSuccess, resetError].forEach(el => el.classList.add('hidden'));
      [loginEmailInput, loginPasswordInput,
       signupFullNameInput, signupUsernameInput, signupEmailInput, signupPasswordInput, signupConfirmPasswordInput,
       resetEmailInput].forEach(el => el.classList.remove('input-error'));

      // Reset password strength bar
      passwordStrengthBar.style.width = '0%';
      passwordStrengthBar.className = 'h-full bg-red-500';

      // Reset forms
      loginFormFields.reset();
      signupFormFields.reset();
      resetPasswordFormFields.reset();

      if (tabToActivate === 'login') {
        loginSection.classList.remove('hidden');
        signupSection.classList.add('hidden');
      } else { // signup
        signupSection.classList.remove('hidden');
        loginSection.classList.add('hidden');
      }
    }

    // --- Validation Functions (same as before) ---

    function validateEmail(email, errorElement, inputElement) {
      if (!email.trim()) {
        showInputError(inputElement, errorElement, 'Email is required.');
        return false;
      }
      if (!/\S+@\S+\.\S+/.test(email)) {
        showInputError(inputElement, errorElement, 'Invalid email format.');
        return false;
      }
      clearInputError(inputElement, errorElement);
      return true;
    }

    function validatePassword(password, errorElement, inputElement) {
      if (!password.trim()) {
        showInputError(inputElement, errorElement, 'Password is required.');
        return false;
      }
      if (password.length < 8) {
        showInputError(inputElement, errorElement, 'Password must be at least 8 characters long.');
        return false;
      }
      clearInputError(inputElement, errorElement);
      return true;
    }

    function validateFullName(fullName, errorElement, inputElement) {
      if (!fullName.trim()) {
        showInputError(inputElement, errorElement, 'Full Name is required.');
        return false;
      }
      clearInputError(inputElement, errorElement);
      return true;
    }

    function validateUsername(username, errorElement, inputElement) {
      if (!username.trim()) {
        showInputError(inputElement, errorElement, 'Username is required.');
        return false;
      }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        showInputError(inputElement, errorElement, 'Username can only contain letters, numbers, and underscores.');
        return false;
      }
      if (username.length < 3) {
        showInputError(inputElement, errorElement, 'Username must be at least 3 characters long.');
        return false;
      }
      clearInputError(inputElement, errorElement);
      return true;
    }

    // --- Event Listeners and Form Submissions ---

    // Tab button clicks
    showSignupBtn.addEventListener('click', () => switchTab('signup'));
    showLoginBtn.addEventListener('click', () => switchTab('login'));
    backToLoginBtn.addEventListener('click', () => switchTab('login'));

    // Toggle Password Visibility
    setupPasswordToggle('toggle-login-password', 'login-password');
    setupPasswordToggle('toggle-signup-password', 'signup-password');
    setupPasswordToggle('toggle-signup-confirm-password', 'signup-confirm-password');

    // Password Strength Indicator Logic for Signup
    signupPasswordInput.addEventListener('input', function() {
      const password = this.value;
      let strength = 0;
      
      // Criteria for password strength
      if (password.length >= 8) strength += 1;
      if (/[A-Z]/.test(password)) strength += 1;
      if (/[0-9]/.test(password)) strength += 1;
      if (/[^A-Za-z0-9]/.test(password)) strength += 1;
      
      const width = strength * 25; // Each criterion adds 25% to the bar width (max 4 criteria for 100%)
      passwordStrengthBar.style.width = `${width}%`;
      
      if (strength <= 1) {
        passwordStrengthBar.className = 'h-full bg-red-500';
      } else if (strength <= 3) {
        passwordStrengthBar.className = 'h-full bg-yellow-500';
      } else {
        passwordStrengthBar.className = 'h-full bg-green-500';
      }
    });

    // --- Login Form Submission (Firebase Integrated) ---
    loginFormFields.addEventListener('submit', async (e) => {
      e.preventDefault(); 
      
      let isValid = true;
      isValid = validateEmail(loginEmailInput.value, loginEmailError, loginEmailInput) && isValid;
      isValid = validatePassword(loginPasswordInput.value, loginPasswordError, loginPasswordInput) && isValid;

      if (!isValid) {
        displayMessage('Please correct the errors in the form.', 'error');
        return;
      }

      loginButtonText.classList.add('hidden');
      loginSpinner.classList.remove('hidden');
      loginSubmitBtn.disabled = true;
      loginGlobalError.classList.add('hidden'); 

      try {
        const userCredential = await signInWithEmailAndPassword(auth, loginEmailInput.value, loginPasswordInput.value);
        const user = userCredential.user;

        // Get user location data for login
        const locationData = await getUserLocation();
        
        // Update last login location in Firestore
        try {
          const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid);
          await updateDoc(userDocRef, {
            lastLoginLocation: locationData
          });
        } catch (error) {
          console.warn('Failed to update login location:', error);
        }

        // Store UID in sessionStorage
        sessionStorage.setItem('digitask_user_uid', user.uid);

        displayMessage('Login successful! Redirecting to dashboard...', 'success');
        setTimeout(() => {
          window.location.href = '/digitask-dashboard';
        }, 1000);

      } catch (error) {
        let errorMessage = "Login failed. Please check your credentials.";
        if (error.code === 'auth/user-disabled') {
          errorMessage = "Account suspended, contact support";
        } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          errorMessage = "Invalid email or password.";
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = "Invalid email format.";
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = "Too many login attempts. Please try again later.";
        } else {
          errorMessage = `Login failed: ${error.message}`;
        }
        loginGlobalError.textContent = errorMessage;
        loginGlobalError.classList.remove('hidden');
        displayMessage(errorMessage, 'error');
      } finally {
        loginButtonText.classList.remove('hidden');
        loginSpinner.classList.add('hidden');
        loginSubmitBtn.disabled = false;
      }
    });

    // --- Forgot Password Link & Modal (Firebase Integrated) ---
    forgotPasswordBtn.addEventListener('click', (e) => {
      e.preventDefault();
      resetEmailInput.value = loginEmailInput.value.trim();
      forgotPasswordModal.classList.remove('hidden');
      setTimeout(() => {
        modalContent.classList.remove('scale-95', 'opacity-0');
        modalContent.classList.add('scale-100', 'opacity-100');
      }, 10);
    });

    closeForgotPasswordBtn.addEventListener('click', () => {
      modalContent.classList.remove('scale-100', 'opacity-100');
      modalContent.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        forgotPasswordModal.classList.add('hidden');
        resetEmailInput.value = ''; 
        resetSuccess.classList.add('hidden');
        resetError.classList.add('hidden');
        clearInputError(resetEmailInput, resetEmailError);
      }, 300);
    });

    forgotPasswordModal.addEventListener('click', (e) => {
      if (e.target === forgotPasswordModal) {
        closeForgotPasswordBtn.click(); 
      }
    });

    resetPasswordFormFields.addEventListener('submit', async (e) => {
      e.preventDefault();
      let isValid = validateEmail(resetEmailInput.value, resetEmailError, resetEmailInput);
      if (!isValid) {
        displayMessage('Please enter a valid email address.', 'error');
        return;
      }

      resetText.classList.add('hidden');
      resetSpinner.classList.remove('hidden');
      resetSubmitBtn.disabled = true;
      resetSuccess.classList.add('hidden');
      resetError.classList.add('hidden');

      try {
        await sendPasswordResetEmail(auth, resetEmailInput.value);
        resetSuccess.classList.remove('hidden');
        resetEmailInput.value = ''; 
        displayMessage('Password reset link sent! Check your email.', 'success');
      } catch (error) {
        let errorMessage = "Failed to send reset link. Please try again.";
        if (error.code === 'auth/user-not-found') {
          errorMessage = "No user found with that email address.";
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = "Invalid email format.";
        }
        resetError.textContent = errorMessage;
        resetError.classList.remove('hidden');
        displayMessage(errorMessage, 'error');
      } finally {
        resetText.classList.remove('hidden');
        resetSpinner.classList.add('hidden');
        resetSubmitBtn.disabled = false;
      }
    });


    // --- Sign Up Form Submission (Firebase Integrated) ---
    signupFormFields.addEventListener('submit', async (e) => {
      e.preventDefault(); 

      let isValid = true;
      isValid = validateFullName(signupFullNameInput.value, signupFullNameError, signupFullNameInput) && isValid;
      isValid = validateUsername(signupUsernameInput.value, signupUsernameError, signupUsernameInput) && isValid;
      isValid = validateEmail(signupEmailInput.value, signupEmailError, signupEmailInput) && isValid;
      isValid = validatePassword(signupPasswordInput.value, signupPasswordError, signupPasswordInput) && isValid;

      if (signupConfirmPasswordInput.value !== signupPasswordInput.value) {
        showInputError(signupConfirmPasswordInput, signupConfirmPasswordError, 'Passwords do not match.');
        isValid = false;
      } else {
        clearInputError(signupConfirmPasswordInput, signupConfirmPasswordError);
      }

      if (!termsCheckbox.checked) {
        showInputError(termsCheckbox, termsError, 'You must agree to the terms and privacy policy.');
        isValid = false;
      } else {
        clearInputError(termsCheckbox, termsError);
      }

      if (!isValid) {
        displayMessage('Please correct the errors in the form.', 'error');
        return;
      }

      signupButtonText.classList.add('hidden');
      signupSpinner.classList.remove('hidden');
      signupSubmitBtn.disabled = true;
      signupGlobalError.classList.add('hidden'); 

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, signupEmailInput.value, signupPasswordInput.value);
        const user = userCredential.user;

        // Update user profile (display name)
        await updateProfile(user, {
          displayName: signupFullNameInput.value.trim()
        });

        // Get user location data
        const locationData = await getUserLocation();
        
        // Create user document in Firestore
        const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid);
        await setDoc(userDocRef, {
          fullName: signupFullNameInput.value.trim(),
          username: signupUsernameInput.value.trim(),
          email: user.email, // Use user.email from Firebase Auth
          profileImageUrl: '', // Default empty profile image
          totalEarnings: 0,
          availableBalance: 0,
          referralCount: 0,
          notificationCount: 0,
          isSeller: false, // Default to false, can be updated later
          isBuyer: true, // Default to true
          createdAt: Timestamp.now(),
          signupLocation: locationData, // Add signup location data
          lastLoginLocation: locationData // Also set as initial login location
        });

        // Store UID in sessionStorage
        sessionStorage.setItem('digitask_user_uid', user.uid);

        displayMessage('Account created successfully! Redirecting to dashboard...', 'success');
        setTimeout(() => {
          window.location.href = '/digitask-dashboard';
        }, 1000);

      } catch (error) {
        let errorMessage = "Account creation failed. Please try again.";
        if (error.code === 'auth/email-already-in-use') {
          errorMessage = "This email is already registered. Try logging in.";
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = "Invalid email format.";
        } else if (error.code === 'auth/weak-password') {
          errorMessage = "Password is too weak. Please choose a stronger one.";
        } else {
          errorMessage = `Account creation failed: ${error.message}`;
        }
        signupGlobalError.textContent = errorMessage;
        signupGlobalError.classList.remove('hidden');
        displayMessage(errorMessage, 'error');
      } finally {
        signupButtonText.classList.remove('hidden');
        signupSpinner.classList.add('hidden');
        signupSubmitBtn.disabled = false;
      }
    });

    // --- Google Login (Firebase Integrated) ---
    googleLoginBtn.addEventListener('click', async () => {
      displayMessage('Redirecting to Google for authentication...', 'info');
      googleLoginBtn.disabled = true;

      try {
        const provider = new GoogleAuthProvider();
        const userCredential = await signInWithPopup(auth, provider);
        const user = userCredential.user;

        // Get user location data
        const locationData = await getUserLocation();
        
        // Check if user document already exists, if not, create it
        const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid);
        const userDocSnap = await getDoc(userDocRef);

        if (!userDocSnap.exists()) {
          // Create new user profile for Google sign-up
          await setDoc(userDocRef, {
            fullName: user.displayName || 'New User',
            username: user.email ? user.email.split('@')[0] : `user_${user.uid.substring(0, 8)}`, // Basic username from email or UID
            email: user.email,
            profileImageUrl: user.photoURL || '',
            totalEarnings: 0,
            availableBalance: 0,
            referralCount: 0,
            notificationCount: 0,
            isSeller: false,
            isBuyer: true,
            createdAt: Timestamp.now(),
            signupLocation: locationData, // Add signup location data
            lastLoginLocation: locationData // Also set as initial login location
          });
        } else {
          // Update last login location for existing users
          try {
            await updateDoc(userDocRef, {
              lastLoginLocation: locationData
            });
          } catch (error) {
            console.warn('Failed to update login location:', error);
          }
        }

        // Store UID in sessionStorage
        sessionStorage.setItem('digitask_user_uid', user.uid);

        displayMessage('Google login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/digitask-dashboard';
        }, 1000);

      } catch (error) {
        let errorMessage = "Google login failed.";
        if (error.code === 'auth/popup-closed-by-user') {
          errorMessage = "Google login window closed.";
        } else if (error.code === 'auth/cancelled-popup-request') {
          errorMessage = "Google login already in progress or cancelled.";
        } else {
          errorMessage = `Google login failed: ${error.message}`;
        }
        displayMessage(errorMessage, 'error');
        console.error("Google login error:", error);
      } finally {
        googleLoginBtn.disabled = false;
      }
    });

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', function() {
      if (window.location.hash === '#signup') {
        switchTab('signup');
      } else {
        switchTab('login');
      }
    });
  </script>
</body>
</html>
