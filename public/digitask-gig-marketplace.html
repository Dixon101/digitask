<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="page:title" content="Browse Gigs & Jobs | DigiTask">
  <meta name="description" content="Discover freelance gigs by category, budget, and delivery time. Apply to jobs and start earning on DigiTask.">
  <title>Gig Marketplace | DigiTask</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="/js/ux-qa.js"></script>
  <style>
    /* Grid View Styles */
    .gig-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    
    /* List View Styles */
    .gig-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .gig-list .gig-card {
      display: flex !important;
      align-items: center;
      padding: 1.5rem;
    }
    .gig-list .gig-info {
      flex-grow: 1;
      min-width: 0;
      margin-right: 1.5rem;
    }
    .gig-list .gig-meta {
      display: flex;
      gap: 2rem;
      text-align: right;
    }
    .gig-list .category-icon {
      margin-right: 1.5rem;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    /* Shared Card Styles */
    .gig-card {
      background: white;
      border-radius: 0.75rem;
      border: 1px solid #e5e7eb;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .gig-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .featured-badge {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 10;
    }
    .category-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    /* View Toggle Styles */
    .view-toggle .active-view {
      background-color: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    /* Bottom Navigation Styles */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 8px;
      z-index: 50;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #6b7280;
      font-size: 0.7rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.5, 1);
      transform: translateY(0);
      width: 20%;
    }
    .nav-btn:hover {
      color: #4f46e5;
      transform: translateY(-4px);
    }
    .nav-btn.active {
      color: #7c3aed;
    }
    .nav-btn i {
      font-size: 1.3rem;
      margin-bottom: 4px;
      transition: all 0.2s ease;
    }
    .nav-btn:hover i {
      transform: scale(1.15);
    }
    .nav-plus-btn {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -30px;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.5, 1);
    }
    .nav-plus-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.3);
    }
    /* Loading state for dynamic content */
    .dynamic-content.loading {
      opacity: 0.5;
      pointer-events: none;
    }
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100px;
    }
    .loading-spinner i {
      font-size: 2rem;
      color: #a0aec0;
    }
    /* Custom Message Box for notifications */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans pb-24">
  <div id="main" role="main" class="visually-hidden" tabindex="-1"></div>
  <!-- Header -->

  <!-- Featured Gigs -->

  <!-- Main Marketplace -->

  <!-- Use shared category utils via window API (side-effect include) -->
  <script src="/shared-category-utils.js"></script>

  <script>
    // --- Global State Variables ---
    let allGigs = []; // Stores all mock gig data
    let currentView = 'grid'; // 'grid' or 'list'
    let currentPage = 1;
    const itemsPerPage = 15; // Max non-featured gigs per page
    const featuredGigsLimit = 5; // Max featured gigs to display

    // --- Mock Data Generation (for frontend simulation) ---
    // Shared category utilities are available on window via /shared-category-utils.js
    
    // Gig categories for filtering (will be fetched from Firestore)
    let gigCategories = [];

    // --- Mock Data Generation (for frontend simulation) ---
    function generateMockGigs(count = 50) {
      const categories = [
        { name: 'Graphics & Design', icon: 'fas fa-paint-brush', color: 'bg-purple-100 text-purple-600' },
        { name: 'Web & App Development', icon: 'fas fa-code', color: 'bg-blue-100 text-blue-600' },
        { name: 'Writing & Copywriting', icon: 'fas fa-pen-fancy', color: 'bg-green-100 text-green-600' },
        { name: 'Video & Audio Editing', icon: 'fas fa-video', color: 'bg-red-100 text-red-600' },
        { name: 'Digital Marketing & SEO', icon: 'fas fa-chart-line', color: 'bg-yellow-100 text-yellow-600' },
        { name: 'Virtual Assistance & Admin Support', icon: 'fas fa-headset', color: 'bg-pink-100 text-pink-600' },
        { name: 'Translation & Transcription', icon: 'fas fa-language', color: 'bg-teal-100 text-teal-600' },
        { name: 'Financial & Tax Services', icon: 'fas fa-calculator', color: 'bg-orange-100 text-orange-600' },
        { name: 'Academic Support & Tutoring', icon: 'fas fa-book-open', color: 'bg-indigo-100 text-indigo-600' },
        { name: 'Legal & Business Documentation', icon: 'fas fa-gavel', color: 'bg-gray-100 text-gray-600' },
        { name: 'Personal Shopper & Import Help', icon: 'fas fa-shopping-bag', color: 'bg-cyan-100 text-cyan-600' },
        { name: 'Travel, Visa & Migration Support', icon: 'fas fa-plane', color: 'bg-lime-100 text-lime-600' },
        { name: 'Coaching, Mentorship & Career Help', icon: 'fas fa-lightbulb', color: 'bg-fuchsia-100 text-fuchsia-600' },
      ];
      const titles = [
        'Premium Logo Design', 'Professional Website Development', 'SEO Optimized Blog Posts',
        'Stunning Video Editing', 'Social Media Content Creation', 'Virtual Assistant Services',
        'Document Translation', 'Tax Preparation Service', 'Custom Mobile App UI',
        'E-book Ghostwriting', 'Podcast Audio Cleanup', 'Google Ads Campaign Setup',
        'Customer Support Chatbot', 'Legal Document Review', 'Financial Analysis Report',
        'Brand Identity Kit', 'Responsive Landing Page', 'Technical Article Writing',
        'Explainer Video Animation', 'Instagram Marketing Strategy', 'Data Entry Specialist',
        'Legal Consulting', 'Investment Portfolio Review', 'Personalized Resume Writing',
        'Travel Itinerary Planning', 'Visa Application Assistance', 'Career Coaching Session',
        'Website Content Audit', 'UI/UX Design Review', 'Voice Over Recording',
      ];
      const descriptions = [
        'Crafting unique and memorable logos tailored to your brand identity with unlimited revisions and source files.',
        'Building fast, secure, and user-friendly websites from scratch using modern frameworks like React and Vue.js.',
        'Engaging and high-ranking content to drive organic traffic and establish thought leadership in your niche.',
        'Professional video editing for YouTube, social media, and corporate use, including motion graphics and sound design.',
        'Developing compelling content strategies for all major social platforms, focusing on audience engagement and growth.',
        'Efficient administrative support to streamline your daily operations, including scheduling, email management, and data entry.',
        'Accurate and fast translation services for various languages, ensuring cultural nuances are preserved.',
        'Expert tax advice and preparation for individuals and businesses, maximizing deductions and ensuring compliance.',
        'Designing intuitive and beautiful user interfaces for mobile applications, focusing on user experience and conversion.',
        'High-quality, engaging e-books written to your specifications, from concept to final draft.',
        'Cleaning and mastering audio for podcasts and voiceovers, ensuring crystal-clear sound quality.',
        'Setting up and optimizing Google Ads campaigns for maximum ROI, targeting the right audience with compelling ad copy.',
        'Developing AI-powered chatbots for seamless customer support, improving response times and customer satisfaction.',
        'Thorough review and drafting of legal documents, ensuring accuracy and compliance with legal standards.',
        'In-depth financial analysis to guide your business decisions, providing clear insights into your financial performance.',
        'Complete brand identity package including logo, colors, and typography, to establish a strong and consistent brand presence.',
        'Designing and developing high-converting landing pages optimized for lead generation and sales.',
        'Well-researched and clearly written technical articles, simplifying complex topics for your target audience.',
        'Creating captivating animated explainer videos that simplify complex ideas and engage your viewers.',
        'Developing effective strategies for Instagram growth and engagement, leveraging trends and analytics.',
        'Accurate and fast data entry services for various industries, ensuring data integrity and efficiency.',
        'Providing expert legal advice and documentation support for startups and small businesses.',
        'Comprehensive review of your investment portfolio with actionable insights to optimize your returns.',
        'Crafting professional and impactful resumes that stand out to recruiters and land you interviews.',
        'Detailed and personalized travel itineraries for your next adventure, including hidden gems and local tips.',
        'Assistance with visa applications and migration processes, ensuring all documentation is accurate and complete.',
        'Personalized coaching to help you achieve your career goals, from job search strategies to skill development.',
        'Comprehensive audit of your website content for SEO and readability, improving search engine rankings and user experience.',
        'Expert review and feedback on your UI/UX designs, ensuring optimal usability and aesthetic appeal.',
        'Clear and professional voice-over recordings for various projects, including commercials, narrations, and e-learning.',
      ];

      const gigs = [];
      for (let i = 0; i < count; i++) {
        const category = categories[Math.floor(Math.random() * categories.length)];
        const price = Math.floor(Math.random() * (100000 - 10000 + 1)) + 10000; // ₦10,000 to ₦100,000
        const delivery = [1, 3, 5, 7, 14, 30][Math.floor(Math.random() * 6)];
        const rating = (Math.random() * (5 - 3.5) + 3.5).toFixed(1); // 3.5 to 5.0
        // Ensure some are featured, up to the limit
        const isFeatured = i < featuredGigsLimit && Math.random() > 0.3; // Make some of the first few featured randomly

        gigs.push({
          id: `gig-${i + 1}`,
          featured: isFeatured,
          title: titles[Math.floor(Math.random() * titles.length)],
          description: descriptions[Math.floor(Math.random() * descriptions.length)],
          category: category.name,
          price: price,
          delivery: delivery, // in days
          rating: parseFloat(rating),
          icon: category.icon,
          iconColor: category.color,
          createdAt: new Date(Date.now() - Math.floor(Math.random() * 30 * 24 * 60 * 60 * 1000)), // Up to 30 days ago
          clientId: `client-${Math.floor(Math.random() * 10) + 1}`,
          clientName: `Client ${String.fromCharCode(65 + Math.floor(Math.random() * 26))}.`,
        });
      }
      return gigs;
    }

    // --- Main Rendering Function ---
    function renderGigs() {
      // Show loading spinners initially
      const featuredContainer = document.getElementById('featured-gigs-container');
      const gigContainer = document.getElementById('gig-container');

      featuredContainer.innerHTML = `
        <div class="col-span-full loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
          <p class="ml-2 text-gray-500">Loading featured gigs...</p>
        </div>
      `;
      gigContainer.innerHTML = `
        <div class="col-span-full loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
          <p class="ml-2 text-gray-500">Loading gigs...</p>
        </div>
      `;

      // Simulate a small delay for loading (for better UX)
      setTimeout(() => {
        // 1. Filter gigs
        const filteredGigs = applyFilters(allGigs);
        
        // 2. Sort gigs
        const sortedGigs = applySorting(filteredGigs);
        
        // 3. Separate featured and non-featured
        const featuredGigs = sortedGigs.filter(gig => gig.featured).slice(0, featuredGigsLimit);
        const nonFeaturedGigs = sortedGigs.filter(gig => !gig.featured);

        // 4. Render featured gigs
        if (featuredGigs.length > 0) {
          featuredContainer.innerHTML = featuredGigs.map(gig => createGigCard(gig, true)).join('');
        } else {
          featuredContainer.innerHTML = `
            <div class="col-span-full text-center py-10 text-gray-500">
              <i class="fas fa-star text-3xl mb-3 text-gray-400"></i>
              <p>No featured gigs available at the moment.</p>
            </div>
          `;
        }

        // 5. Apply pagination to non-featured gigs
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const gigsToDisplay = nonFeaturedGigs.slice(startIndex, endIndex);

        // 6. Set the correct view class
        gigContainer.className = currentView === 'grid' ? 'gig-grid mb-8 dynamic-content' : 'gig-list mb-8 dynamic-content';

        // 7. Render non-featured gigs
        if (gigsToDisplay.length > 0) {
          gigContainer.innerHTML = gigsToDisplay.map(gig => createGigCard(gig, false)).join('');
        } else {
          gigContainer.innerHTML = `
            <div class="col-span-full text-center py-10 text-gray-500">
              <i class="fas fa-search text-3xl mb-3 text-gray-400"></i>
              <p>No gigs found matching your criteria.</p>
            </div>
          `;
        }

        // 8. Update results count and pagination UI
        document.getElementById('total-results').textContent = nonFeaturedGigs.length;
        updatePaginationUI(nonFeaturedGigs.length);

      }, 300); // Simulate network delay
    }

    // --- Filtering Logic ---
    function applyFilters(gigs) {
      const category = (document.getElementById('category-filter').value || 'all');
      const minPrice = parseFloat(document.getElementById('min-price-filter').value) || 0;
      const maxPrice = parseFloat(document.getElementById('max-price-filter').value) || Infinity;
      const delivery = document.getElementById('delivery-filter').value;
      const searchTerm = document.getElementById('search-gigs').value.toLowerCase();

      return gigs.filter(gig => {
        const matchesCategory = category === 'all' || gig.category === category;
        const matchesPrice = gig.price >= minPrice && gig.price <= maxPrice;
        // For delivery, if 'Any' is selected, all gigs match. Otherwise, match gigs with delivery <= selected value.
        const matchesDelivery = delivery === 'all' || gig.delivery <= parseInt(delivery);
        const matchesSearch = gig.title.toLowerCase().includes(searchTerm) || gig.description.toLowerCase().includes(searchTerm);
        
        return matchesCategory && matchesPrice && matchesDelivery && matchesSearch;
      });
    }

    // --- Sorting Logic ---
    function applySorting(gigs) {
      const sortBy = document.getElementById('sort-filter').value;

      return [...gigs].sort((a, b) => {
        switch (sortBy) {
          case 'rating':
            return b.rating - a.rating; // Descending
          case 'newest':
            return b.createdAt.getTime() - a.createdAt.getTime(); // Descending
          case 'price-low':
            return a.price - b.price; // Ascending
          case 'price-high':
            return b.price - a.price; // Descending
          case 'relevance':
          default:
            return 0; // Maintain original order, or a default relevance
        }
      });
    }

    // --- Pagination Logic ---
    function updatePaginationUI(totalItems) {
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      const paginationNav = document.getElementById('pagination-nav');
      paginationNav.innerHTML = ''; // Clear previous buttons

      if (totalPages <= 1) {
        return; // No pagination needed
      }

      // Previous button
      const prevBtn = document.createElement('button');
      prevBtn.className = `px-3 py-2 rounded-l-lg border border-gray-300 bg-white text-gray-500 hover:bg-gray-50 text-sm ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}`;
      prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
      prevBtn.disabled = currentPage === 1;
      prevBtn.addEventListener('click', () => gotoPage(currentPage - 1));
      paginationNav.appendChild(prevBtn);

      // Page numbers (display up to 3 pages around current, or total if less)
      let startPage = Math.max(1, currentPage - 1);
      let endPage = Math.min(totalPages, currentPage + 1);

      // Adjust start/end to always show 3 pages if possible
      if (totalPages >= 3) {
        if (currentPage === 1) {
          endPage = 3;
        } else if (currentPage === totalPages) {
          startPage = totalPages - 2;
        }
      } else {
        startPage = 1;
        endPage = totalPages;
      }
      
      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `px-4 py-2 border-t border-b border-gray-300 bg-white text-sm ${i === currentPage ? 'text-indigo-600 font-medium' : 'text-gray-500 hover:bg-gray-50'}`;
        pageBtn.textContent = i;
        pageBtn.addEventListener('click', () => gotoPage(i));
        paginationNav.appendChild(pageBtn);
      }

      // Next button
      const nextBtn = document.createElement('button');
      nextBtn.className = `px-3 py-2 rounded-r-lg border border-gray-300 bg-white text-gray-500 hover:bg-gray-50 text-sm ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}`;
      nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.addEventListener('click', () => gotoPage(currentPage + 1));
      paginationNav.appendChild(nextBtn);
    }

      const listViewBtn = document.getElementById('list-view-btn');
      
      if (gridViewBtn) {
        gridViewBtn.addEventListener('click', () => {
          currentView = 'grid';
          gridViewBtn.classList.add('bg-indigo-100', 'text-indigo-600');
          listViewBtn.classList.remove('bg-indigo-100', 'text-indigo-600');
          renderGigs();
        });
      }
      
      if (listViewBtn) {
        listViewBtn.addEventListener('click', () => {
          currentView = 'list';
          listViewBtn.classList.add('bg-indigo-100', 'text-indigo-600');
          gridViewBtn.classList.remove('bg-indigo-100', 'text-indigo-600');
          renderGigs();
        });
      }
      
      // Pagination event listeners are handled in updatePaginationUI
    }

    // Initialize category filter with Firestore data
    async function initializeCategoryFilter() {
      try {
        // Prefer Firestore categories via shared utils
        if (window.AuthManager && typeof AuthManager.getDb === 'function' && window.fetchJobCategoriesFromFirestore) {
          const dbRef = AuthManager.getDb();
          gigCategories = await window.fetchJobCategoriesFromFirestore(dbRef);
        } else {
          gigCategories = window.DEFAULT_CATEGORIES || [];
        }
        if (window.renderCategorySelectOptions) {
          window.renderCategorySelectOptions('category-filter', gigCategories, 'All Categories');
        }
      } catch (error) {
        // Fallback only for real errors
        if (error && (error.code === 'permission-denied' || error.code === 'unavailable')) {
          if (window.renderCategorySelectOptions) {
            window.renderCategorySelectOptions('category-filter', window.DEFAULT_CATEGORIES || [], 'All Categories');
          }
        }
      }
    }

    // Make functions globally available
    window.initializeMarketplace = initializeMarketplace;
    window.fetchGigsFromFirestore = fetchGigsFromFirestore;
    window.showErrorMessage = showErrorMessage;
  </script>
</body>
</html>
